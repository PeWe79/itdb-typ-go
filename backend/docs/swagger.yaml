        description: 绑定的企业微信成员 userid
        example: zhangsan
        type: string
    type: object
  router.swaggerWecomCallbackRequest:
    properties:
      code:
        description: 企业微信回调携带的授权码
        example: abc123
        type: string
      state:
        description: 发起跳转时签发的防伪状态串
        example: eyJwIjoibG9naW4iLCJlIjoxNzI2LCJuIjoiYTFiMmMzIn0.5f8a
        type: string
    type: object
  router.swaggerWecomProvider:
    properties:
      config:
        allOf:
        - $ref: '#/definitions/router.swaggerWecomProviderConfig'
        description: 配置项
      enabled:
        description: 是否启用
        example: true
        type: boolean
      id:
        description: 提供者标识
        example: wecom
        type: string
      name:
        description: 显示名称
        example: 企业微信
        type: string
      type:
        description: 提供者类型
        example: wecom
        type: string
      updatedAt:
        description: 更新时间
        example: "2026-09-18 12:00:00"
        type: string
    type: object
  router.swaggerWecomProviderConfig:
    properties:
      agentid:
        description: 应用 AgentID
        example: "1000002"
        type: string
      corpid:
        description: 企业 ID（corpid）
        example: ww1234567890
        type: string
      hasSecret:
        description: 是否已配置应用 Secret
        example: true
        type: boolean
      redirectPrefix:
        description: 回调地址前缀（不含 /login 路径）
        example: https://itdb.example.com
        type: string
    type: object
  router.swaggerWecomProviderRequest:
    properties:
      clearConfig:
        description: 是否清空已存 Secret
        example: false
        type: boolean
      config:
        allOf:
        - $ref: '#/definitions/router.swaggerWecomProviderSaveConfig'
        description: 配置项（secret 仅在更换时传入）
      enabled:
        description: 是否启用
        example: true
        type: boolean
      name:
        description: 显示名称
        example: 企业微信
        type: string
    type: object
  router.swaggerWecomProviderSaveConfig:
    properties:
      agentid:
        description: 应用 AgentID
        example: "1000002"
        type: string
      corpid:
        description: 企业 ID（corpid）
        example: ww1234567890
        type: string
      redirectPrefix:
        description: 回调地址前缀（不含 /login 路径）
        example: https://itdb.example.com
        type: string
      secret:
        description: 应用 Secret
        example: j8Kx2pQ
        type: string
    type: object
  router.tagMutationPayload:
    properties:
      action:
        description: 动作（add/remove）
        type: string
      name:
        description: 标记名称
        type: string
    type: object
info:
  contact: {}
  description: ITDB IT 资产管理系统后端 API 文档。除登录和健康检查外，接口默认需要 Bearer Token。
  title: ITDB API
  version: 1.0.0
paths:
  /api/agents:
    get:
      description: 获取代理（硬件厂商、软件厂商、供应商、采购方、承包方）列表，支持关键字搜索
      parameters:
      - description: 搜索关键词
        in: query
        name: search
        type: string
      - description: 返回数量，-1 表示全部
        in: query
        name: limit
        type: integer
      - description: 偏移量
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/router.swaggerGenericObject'
            type: array
      security:
      - BearerAuth: []
      summary: 获取厂商/代理商列表
      tags:
      - 代理
    post:
      consumes:
      - application/json
      description: 创建代理；同一名称（忽略大小写与首尾空格）不允许重复
      parameters:
      - description: 厂商/代理商
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/router.agentPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/router.swaggerIDResponse'
      security:
      - BearerAuth: []
      summary: 创建厂商/代理商
      tags:
      - 代理
  /api/agents/{id}:
    delete:
      description: 删除代理并置空硬件、软件、单据中的引用；仍被引用时返回 409
      parameters:
      - description: 厂商/代理商 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.swaggerOKResponse'
      security:
      - BearerAuth: []
      summary: 删除厂商/代理商
      tags:
      - 代理
    get:
      description: 按编号获取代理详情
      parameters:
      - description: 厂商/代理商 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.swaggerGenericObject'
      security:
      - BearerAuth: []
      summary: 获取厂商/代理商详情
      tags:
      - 代理
    put:
      consumes:
      - application/json
      description: 更新代理；取消仍被引用的类型会被整体拒绝
      parameters:
      - description: 厂商/代理商 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 厂商/代理商
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/router.agentPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.swaggerIDResponse'
      security:
      - BearerAuth: []
      summary: 更新厂商/代理商
      tags:
      - 代理
  /api/auth/change-password:
    post:
      consumes:
      - application/json
      description: 修改当前登录用户的密码，成功后需重新登录
      parameters:
      - description: 密码修改请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/router.changePasswordBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.swaggerMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.swaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.swaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 修改当前用户密码
      tags:
      - 认证
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: 用户登录，支持本地密码与 AD/LDAP 两种方式，成功返回令牌与用户信息
      parameters:
      - description: 登录信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/router.authLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.authLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.swaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.swaggerErrorResponse'
      summary: 用户登录
      tags:
      - 认证
  /api/auth/logout:
    post:
      description: 退出当前会话，并写入用户注销审计
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.swaggerOKResponse'
      security:
      - BearerAuth: []
      summary: 登出当前会话
      tags:
      - 认证
  /api/auth/me:
    get:
      description: 获取当前登录用户的资料、直接角色、有效角色与权限清单
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.swaggerGenericObject'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.swaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取当前用户
      tags:
      - 认证
  /api/auth/password-reset/captcha:
    get:
      description: 获取找回密码图形验证码，无需认证
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.swaggerPasswordResetCaptchaResponse'
      summary: 获取找回密码图形验证码
      tags:
      - 认证
  /api/auth/password-reset/confirm:
    post:
      consumes:
      - application/json
      description: 凭邮箱验证码完成找回密码，重置账号密码并写入审计
      parameters:
      - description: 找回密码确认
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/router.swaggerPasswordResetConfirmRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.swaggerMessageResponse'
      summary: 确认找回密码
      tags:
      - 认证
  /api/auth/password-reset/send:
    post:
      consumes:
      - application/json
      description: 向校验通过的邮箱发送找回密码验证码，受发送冷却与限流窗口约束
      parameters:
      - description: 找回密码验证码发送
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/router.swaggerPasswordResetSendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.swaggerPasswordResetSendResponse'
      summary: 发送找回密码验证码
      tags:
      - 认证
  /api/auth/password-reset/verify:
    post:
      consumes:
      - application/json
      description: 校验用户名与图形验证码，换取找回密码流程令牌
      parameters:
      - description: 找回密码身份校验
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/router.swaggerPasswordResetVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.swaggerPasswordResetVerifyResponse'
      summary: 校验找回密码身份
      tags:
      - 认证
  /api/auth/providers:
    get:
      description: 获取登录页可用的认证方式与找回密码开关，无需认证
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.swaggerPublicAuthProvidersResponse'
      summary: 获取公开认证方式
      tags:
      - 认证
  /api/auth/wecom/authorize:
    get:
      description: 生成企业微信 Web 扫码登录页地址（含防伪 state），前端在当前窗口跳转；需已启用企业微信认证
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.swaggerWecomAuthorizeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.swaggerErrorResponse'
      summary: 获取企业微信扫码登录地址
      tags:
      - 认证
  /api/auth/wecom/bind:
    delete:
      description: 解除当前登录用户的企业微信绑定
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.swaggerOKResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.swaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 解绑企业微信账号
      tags:
      - 认证
    post:
      consumes:
      - application/json
      description: 校验绑定 state 后用授权码换取企业微信成员 userid，与当前用户建立绑定；该企微已绑定其他用户时返回 409
      parameters:
      - description: 扫码回调载荷
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/router.swaggerWecomCallbackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.swaggerWecomBindResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.swaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.swaggerErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/router.swaggerErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/router.swaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 绑定企业微信账号
      tags:
      - 认证
  /api/auth/wecom/bind-url:
    get:
      description: 为当前登录用户生成企业微信绑定扫码地址，state 绑定当前用户；需已启用企业微信认证
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.swaggerWecomAuthorizeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.swaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.swaggerErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取企业微信绑定扫码地址
      tags:
      - 认证
  /api/auth/wecom/callback:
    post:
      consumes:
      - application/json
      description: 校验 state 后用授权码换取企业微信成员身份，按绑定关系登录并返回令牌与用户信息；未绑定时返回 401
      parameters:
      - description: 扫码回调载荷
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/router.swaggerWecomCallbackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.authLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.swaggerErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.swaggerErrorResponse'
      summary: 企业微信扫码登录回调
      tags:
      - 认证
  /api/backups/database:
    get:
      description: 下载数据库备份（itdb-日期.db）；携带 files=1 时按数据库实际引用的文件打包为 zip（文件位于包内 files
        目录），引用文件全部不存在或未引用时仅导出 db 文件，缺失文件写入备份审计
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
      security:
      - BearerAuth: []
      summary: 下载数据库备份
      tags:
      - 备份
  /api/bootstrap:
    get:
      description: 获取前端启动所需的字典、引用选项与权限数据
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.swaggerGenericObject'
      security:
      - BearerAuth: []
      summary: 获取前端启动字典数据
      tags:
      - 启动数据
  /api/browse/tree:
    get:
      description: 按类型、部门、用户、代理等维度获取资产导航树
      parameters:
      - description: 节点 ID
        in: query
        name: id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/router.browseNode'
            type: array
      security:
      - BearerAuth: []
      summary: 获取浏览树
      tags:
      - 浏览树
  /api/contracts:
    get:
      description: 获取合同列表，支持关键字搜索
      parameters:
      - description: 搜索关键词
        in: query
        name: search
        type: string
      - description: 返回数量，-1 表示全部
        in: query
        name: limit
        type: integer
      - description: 偏移量
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/router.swaggerGenericObject'
            type: array
      security:
      - BearerAuth: []
      summary: 获取合同列表
      tags:
      - 合同
    post:
      consumes:
      - application/json
      description: 创建合同；合同标题不允许重复
      parameters:
      - description: 合同
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/router.contractPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/router.swaggerIDResponse'
      security:
      - BearerAuth: []
      summary: 创建合同
      tags:
      - 合同
  /api/contracts/{id}:
    delete:
      description: 删除合同；被下级合同引用时返回 409
      parameters:
      - description: 合同 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.swaggerOKResponse'
      security:
      - BearerAuth: []
      summary: 删除合同
      tags:
      - 合同
    get:
      description: 按编号获取合同详情及全部关联
      parameters:
      - description: 合同 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.swaggerGenericObject'
      security:
      - BearerAuth: []
      summary: 获取合同详情
      tags:
      - 合同
    put:
      consumes:
      - application/json
      description: 更新合同；备件、事件历史随表单一并保存，重名标题返回 409
      parameters:
      - description: 合同 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 合同
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/router.contractPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.swaggerIDResponse'
      security:
      - BearerAuth: []
      summary: 更新合同
      tags:
      - 合同
  /api/contracts/{id}/events:
    get:
      description: 获取指定合同的事件历史列表
      parameters:
      - description: 合同 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/router.swaggerGenericObject'
            type: array
      security:
      - BearerAuth: []
      summary: 获取合同事件
      tags:
      - 合同事件
    post:
      consumes:
      - application/json
      description: 为指定合同新增一条事件历史
      parameters:
      - description: 合同 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 合同事件
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/router.contractEventPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/router.swaggerIDResponse'
      security:
      - BearerAuth: []
      summary: 创建合同事件
      tags:
      - 合同事件
  /api/contracts/{id}/events/{eventId}:
    delete:
      description: 删除指定的事件历史
      parameters:
      - description: 合同 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 事件 ID
        in: path
        name: eventId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.swaggerOKResponse'
      security:
      - BearerAuth: []
      summary: 删除合同事件
      tags:
      - 合同事件
    put:
      consumes:
      - application/json
      description: 更新指定的事件历史
      parameters:
      - description: 合同 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 事件 ID
        in: path
        name: eventId
        required: true
        type: integer
      - description: 合同事件
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/router.contractEventPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.swaggerIDResponse'
      security:
      - BearerAuth: []
      summary: 更新合同事件
      tags:
      - 合同事件
  /api/contracts/next-event-id:
    get:
      description: 获取下一个可用的合同事件编号
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.swaggerGenericObject'
      security:
      - BearerAuth: []
      summary: 获取下一个合同事件编号
      tags:
      - 合同事件
  /api/dashboard/summary:
    get:
      description: 获取仪表盘各资源总数统计，需要任意查看权限
      produces:
      - application/json
      responses:
        "200":
