  <rect width="512" height="512" rx="112" fill="url(#tile)" />
  <rect width="512" height="512" rx="112" fill="url(#glowBlue)" />
  <rect width="512" height="512" rx="112" fill="url(#glowCyan)" />
  <rect class="ring" x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="rgba(148,197,255,0.28)" stroke-width="3" />

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="131" y="111" width="250" height="290" rx="44" stroke="url(#frame)" stroke-width="17" />
    <rect class="dim" x="163" y="155" width="186" height="56" rx="16" stroke="rgba(148,197,255,0.42)" stroke-width="11" />
    <rect class="dim" x="163" y="237" width="186" height="56" rx="16" stroke="rgba(148,197,255,0.42)" stroke-width="11" />
    <path class="dim-line" d="M181 183h44M181 265h44" stroke="rgba(148,197,255,0.36)" stroke-width="10" />
    <rect x="163" y="319" width="186" height="56" rx="16" fill="url(#active)" />
