<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ITDB app icon">
  <title>ITDB</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop class="tile-a" offset="0" stop-color="#1f3a63" />
      <stop class="tile-b" offset="0.55" stop-color="#16294a" />
      <stop class="tile-c" offset="1" stop-color="#0e1c36" />
    </linearGradient>
    <linearGradient id="frame" x1="131" y1="111" x2="381" y2="401" gradientUnits="userSpaceOnUse">
      <stop class="frame-a" offset="0" stop-color="#8abcff" />
      <stop class="frame-b" offset="1" stop-color="#4fd8ea" />
    </linearGradient>
    <linearGradient id="active" x1="163" y1="319" x2="349" y2="375" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.16" cy="0.06" r="0.8">
      <stop class="glow-blue" offset="0" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.88" cy="0.96" r="0.75">
      <stop class="glow-cyan" offset="0" stop-color="#06b6d4" stop-opacity="0.26" />
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <style>
      @media (prefers-color-scheme: light) {
        .tile-a { stop-color: #d7e7fa }
        .tile-b { stop-color: #c2d9f6 }
        .tile-c { stop-color: #a9c7f0 }
        .frame-a { stop-color: #2563eb }
        .frame-b { stop-color: #0891b2 }
        .glow-blue { stop-opacity: 0.2 }
        .glow-cyan { stop-opacity: 0.12 }
        .ring { stroke: rgba(30, 64, 175, 0.25) }
        .dim { stroke: rgba(37, 99, 235, 0.42) }
        .dim-line { stroke: rgba(37, 99, 235, 0.34) }
      }
    </style>
